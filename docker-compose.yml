services:
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusconnect_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusconnect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
